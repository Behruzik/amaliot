name: Java verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp verify
      - name: Run the packaged demo through HTTP
        shell: bash
        run: |
          java -jar target/Amaliyot-0.0.1-SNAPSHOT.jar --spring.profiles.active=demo > target/demo-startup.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, time
          from urllib.request import urlopen
          for attempt in range(120):
              try:
                  with urlopen('http://127.0.0.1:8080/actuator/health', timeout=2) as response:
                      if json.load(response).get('status') == 'UP':
                          break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Demo did not become healthy; inspect target/demo-startup.log')
          PY
          python3 scripts/smoke_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-and-pdf-samples
          path: |
            target/surefire-reports/
            target/sample-result.pdf
            target/sample-certificate.pdf
            target/demo-startup.log
            docs/examples/
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amaliyot_tests
          POSTGRES_USER: amaliyot
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amaliyot -d amaliyot_tests"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: Flyway, transactions and API on PostgreSQL
        run: >-
          ./mvnw -B -ntp test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/amaliyot_tests
          -Dspring.datasource.username=amaliyot
          -Dspring.datasource.password=ci-test-password
          -Dtest=AmaliyotApplicationTests,BackendWorkflowTests,DomainRegressionTests,PdfApiIntegrationTests,SecurityRegressionTests,SwaggerIntegrationTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-reports
          path: target/surefire-reports/
