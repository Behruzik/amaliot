# All deployment secrets are supplied by environment variables or .env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
security.jwt.require-configured-secret=true
security.jwt.secret-base64=${JWT_SECRET_BASE64}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
