# Place .env in the project root and launch the app with that directory as the working directory.
spring.config.import=optional:file:./.env[.properties]
spring.application.name=Amaliyot

# Local data survives restarts. Use the explicit demo profile for disposable data.
# Set DB_URL and DB_USERNAME/DB_PASSWORD for PostgreSQL; see README.md.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/amaliyot;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret-base64=${JWT_SECRET_BASE64:}
security.jwt.token-minutes=${JWT_TOKEN_MINUTES:60}
tests.expiry-scan-ms=${TEST_EXPIRY_SCAN_MS:15000}
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
# Prevent the browser from sending the API description to a remote validator.
springdoc.swagger-ui.validator-url=
# Preserve ISO-8601 strings in JSON for existing API clients.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

spring.profiles.active=demo