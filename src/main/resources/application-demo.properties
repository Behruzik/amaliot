# Explicit, disposable local sandbox. Never activate on a public server.
spring.config.import=
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:amaliyot-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
app.upload-dir=target/demo-uploads
SUPER_ADMIN_EMAIL=admin.demo@example.test
SUPER_ADMIN_PHONE=+998900000001
security.jwt.require-configured-secret=false
