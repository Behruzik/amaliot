# This test-only file shadows main application.properties: tests never read .env
# and never connect to the developer's DB_URL or production database.
spring.application.name=Amaliyot-tests
spring.datasource.url=jdbc:h2:mem:amaliyot-tests-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.profiles.active=test
app.scheduling.enabled=false
app.upload-dir=target/test-uploads
security.jwt.token-minutes=60
security.jwt.require-configured-secret=false
SUPER_ADMIN_PHONE=+998900000001
springdoc.swagger-ui.path=/swagger-ui.html
